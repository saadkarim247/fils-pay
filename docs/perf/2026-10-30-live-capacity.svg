<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Live checkout capacity on the Dilmune box, and where the CPU went</title>
<desc id="d">Accepted, before fix: 10/s offered gives 9.7/s; 20/s offered gives 10.5/s; 30/s offered gives 8.9/s; 40/s offered gives 8.9/s; 60/s offered gives 9.3/s. Turned away (503), before fix: 10/s offered gives 0.2/s; 20/s offered gives 9.6/s; 30/s offered gives 21.2/s; 40/s offered gives 31.1/s; 60/s offered gives 50.7/s. Accepted, after fix (bug 75): 10/s offered gives 10.0/s; 20/s offered gives 16.3/s; 30/s offered gives 18.1/s; 40/s offered gives 17.4/s; 60/s offered gives 15.5/s. CPU per accepted checkout: before fix, Postgres 28.8 ms, API 15.8 ms; after fix, Postgres 13.8 ms, API 10.4 ms.</desc>
<style>
  .bg { fill: #fcfcfb } .title { font-size: 16px; font-weight: 600; fill: #1f1f1d } .note { font-size: 11.5px; fill: #5f5e57 }
  .panel { font-size: 12.5px; font-weight: 600; fill: #1f1f1d } .axis { font-size: 11px; fill: #6f6e66 } .value { font-size: 11.5px; fill: #3f3e39 }
  .lab { font-size: 11px; font-weight: 600; fill: #1f1f1d } .grid { stroke: #e6e5df; stroke-width: 1 } .target { stroke: #8a897f; stroke-width: 1; stroke-dasharray: 4 3 }
  .track { fill: #ecebe5 } .bar { fill: #6f6e66 } .limit { stroke: #1f1f1d; stroke-width: 1.5 }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round } .dot { stroke: #fcfcfb; stroke-width: 2 }
  .s1 { fill: #2a78d6; stroke: #2a78d6 } .s2 { fill: #eb6834; stroke: #eb6834 } .s3 { fill: #1baf7a; stroke: #1baf7a }
  .line.s1, .line.s2, .line.s3 { fill: none }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19 } .title, .panel, .lab { fill: #f0efec } .note, .value { fill: #c3c2b7 } .axis { fill: #a3a29a }
    .grid { stroke: #34332f } .dot { stroke: #1a1a19 } .track { fill: #2c2b28 } .bar { fill: #a3a29a } .limit { stroke: #f0efec }
    .s1 { fill: #3987e5; stroke: #3987e5 } .s2 { fill: #d95926; stroke: #d95926 } .s3 { fill: #199e70; stroke: #199e70 }
  }
</style>
<rect class="bg" width="900" height="370" rx="8"/>
<g transform="translate(20,0)">
<text class="title" x="0" y="28">Live capacity (Dilmune, 1 vCPU / 2 GB, k6 over HTTPS from a laptop)</text>
<text class="note" x="0" y="47">30 s per step, payment-link checkout. 0 errors at every step; money invariants held after every run.</text>
<rect class="s1" x="0" y="62" width="12" height="10" rx="2"/><text class="value" x="17" y="71">Accepted, before fix</text><rect class="s2" x="250" y="62" width="12" height="10" rx="2"/><text class="value" x="267" y="71">Turned away (503), before fix</text><rect class="s3" x="500" y="62" width="12" height="10" rx="2"/><text class="value" x="517" y="71">Accepted, after fix (bug 75)</text>
<line class="grid" x1="44" x2="44" y1="104" y2="314"/><text class="axis" x="44" y="330" text-anchor="middle">0</text><line class="grid" x1="100.66666666666666" x2="100.66666666666666" y1="104" y2="314"/><text class="axis" x="100.66666666666666" y="330" text-anchor="middle">10</text><line class="grid" x1="157.33333333333331" x2="157.33333333333331" y1="104" y2="314"/><text class="axis" x="157.33333333333331" y="330" text-anchor="middle">20</text><line class="grid" x1="214" x2="214" y1="104" y2="314"/><text class="axis" x="214" y="330" text-anchor="middle">30</text><line class="grid" x1="270.66666666666663" x2="270.66666666666663" y1="104" y2="314"/><text class="axis" x="270.66666666666663" y="330" text-anchor="middle">40</text><line class="grid" x1="327.33333333333337" x2="327.33333333333337" y1="104" y2="314"/><text class="axis" x="327.33333333333337" y="330" text-anchor="middle">50</text><line class="grid" x1="384" x2="384" y1="104" y2="314"/><text class="axis" x="384" y="330" text-anchor="middle">60</text><line class="grid" x1="44" x2="384" y1="314" y2="314"/><text class="axis" x="36" y="318" text-anchor="end">0</text><line class="grid" x1="44" x2="384" y1="279" y2="279"/><text class="axis" x="36" y="283" text-anchor="end">10</text><line class="grid" x1="44" x2="384" y1="244" y2="244"/><text class="axis" x="36" y="248" text-anchor="end">20</text><line class="grid" x1="44" x2="384" y1="209" y2="209"/><text class="axis" x="36" y="213" text-anchor="end">30</text><line class="grid" x1="44" x2="384" y1="174" y2="174"/><text class="axis" x="36" y="178" text-anchor="end">40</text><line class="grid" x1="44" x2="384" y1="139" y2="139"/><text class="axis" x="36" y="143" text-anchor="end">50</text><line class="grid" x1="44" x2="384" y1="104" y2="104"/><text class="axis" x="36" y="108" text-anchor="end">60</text><line class="target" x1="44" y1="314" x2="384" y2="104"/><text class="axis" x="338.6666666666667" y="118" text-anchor="end">offered</text><text class="axis" x="214" y="348" text-anchor="middle">Offered load (checkouts started per second)</text><text class="panel" x="44" y="90">Checkouts per second, live box</text><polyline class="line s1" points="100.66666666666666,280.1666666666667 157.33333333333331,277.3666666666667 214,282.96666666666664 270.66666666666663,282.73333333333335 384,281.56666666666666"/><circle class="dot s1" cx="100.66666666666666" cy="280.1666666666667" r="4.5"><title>Accepted, before fix, 10/s offered: 9.7/s, p95 4.8 s, 0 errors</title></circle><circle class="dot s1" cx="157.33333333333331" cy="277.3666666666667" r="4.5"><title>Accepted, before fix, 20/s offered: 10.5/s, p95 4.6 s, 0 errors</title></circle><circle class="dot s1" cx="214" cy="282.96666666666664" r="4.5"><title>Accepted, before fix, 30/s offered: 8.9/s, p95 6.0 s, 0 errors</title></circle><circle class="dot s1" cx="270.66666666666663" cy="282.73333333333335" r="4.5"><title>Accepted, before fix, 40/s offered: 8.9/s, p95 5.3 s, 0 errors</title></circle><circle class="dot s1" cx="384" cy="281.56666666666666" r="4.5"><title>Accepted, before fix, 60/s offered: 9.3/s, p95 5.2 s, 0 errors</title></circle><polyline class="line s2" points="100.66666666666666,313.18333333333334 157.33333333333331,280.51666666666665 214,239.91666666666666 270.66666666666663,205.15 384,136.4333333333333"/><circle class="dot s2" cx="100.66666666666666" cy="313.18333333333334" r="4.5"><title>Turned away (503), before fix, 10/s offered: 0.2/s, p95 4.8 s, 0 errors</title></circle><circle class="dot s2" cx="157.33333333333331" cy="280.51666666666665" r="4.5"><title>Turned away (503), before fix, 20/s offered: 9.6/s, p95 4.6 s, 0 errors</title></circle><circle class="dot s2" cx="214" cy="239.91666666666666" r="4.5"><title>Turned away (503), before fix, 30/s offered: 21.2/s, p95 6.0 s, 0 errors</title></circle><circle class="dot s2" cx="270.66666666666663" cy="205.15" r="4.5"><title>Turned away (503), before fix, 40/s offered: 31.1/s, p95 5.3 s, 0 errors</title></circle><circle class="dot s2" cx="384" cy="136.4333333333333" r="4.5"><title>Turned away (503), before fix, 60/s offered: 50.7/s, p95 5.2 s, 0 errors</title></circle><polyline class="line s3" points="100.66666666666666,278.8833333333333 157.33333333333331,256.95 214,250.76666666666665 270.66666666666663,253.1 384,259.6333333333333"/><circle class="dot s3" cx="100.66666666666666" cy="278.8833333333333" r="4.5"><title>Accepted, after fix (bug 75), 10/s offered: 10.0/s, p95 3.0 s, 0 errors</title></circle><circle class="dot s3" cx="157.33333333333331" cy="256.95" r="4.5"><title>Accepted, after fix (bug 75), 20/s offered: 16.3/s, p95 3.1 s, 0 errors</title></circle><circle class="dot s3" cx="214" cy="250.76666666666665" r="4.5"><title>Accepted, after fix (bug 75), 30/s offered: 18.1/s, p95 2.9 s, 0 errors</title></circle><circle class="dot s3" cx="270.66666666666663" cy="253.1" r="4.5"><title>Accepted, after fix (bug 75), 40/s offered: 17.4/s, p95 3.1 s, 0 errors</title></circle><circle class="dot s3" cx="384" cy="259.6333333333333" r="4.5"><title>Accepted, after fix (bug 75), 60/s offered: 15.5/s, p95 3.2 s, 0 errors</title></circle><text class="lab" x="390" y="285.56666666666666">~9/s</text><text class="lab" x="390" y="140.4333333333333">51/s</text><text class="lab" x="390" y="263.6333333333333">~16/s</text><text class="panel" x="494" y="90">CPU time per accepted checkout (at 30/s offered)</text><line class="grid" x1="494" x2="494" y1="104" y2="254"/><text class="axis" x="494" y="270" text-anchor="middle">0</text><line class="grid" x1="534" x2="534" y1="104" y2="254"/><text class="axis" x="534" y="270" text-anchor="middle">5</text><line class="grid" x1="574" x2="574" y1="104" y2="254"/><text class="axis" x="574" y="270" text-anchor="middle">10</text><line class="grid" x1="614" x2="614" y1="104" y2="254"/><text class="axis" x="614" y="270" text-anchor="middle">15</text><line class="grid" x1="654" x2="654" y1="104" y2="254"/><text class="axis" x="654" y="270" text-anchor="middle">20</text><line class="grid" x1="694" x2="694" y1="104" y2="254"/><text class="axis" x="694" y="270" text-anchor="middle">25</text><line class="grid" x1="734" x2="734" y1="104" y2="254"/><text class="axis" x="734" y="270" text-anchor="middle">30</text><line class="grid" x1="774" x2="774" y1="104" y2="254"/><text class="axis" x="774" y="270" text-anchor="middle">35</text><text class="axis" x="634" y="288" text-anchor="middle">milliseconds of CPU (kernel cgroup counters)</text><text class="value" x="486" y="138" text-anchor="end">Postgres</text><rect class="s1" x="494" y="116" width="230.07518796992485" height="18" rx="4"><title>Postgres, before fix: 28.8 ms CPU per checkout, throttled in 90% of periods</title></rect><text class="value" x="730.0751879699249" y="129">29 ms before</text><rect class="s3" x="494" y="140" width="110.70110701107012" height="18" rx="4"><title>Postgres, after fix: 13.8 ms CPU per checkout, throttled in 87% of periods</title></rect><text class="lab" x="610.7011070110701" y="153">14 ms after</text><text class="value" x="486" y="210" text-anchor="end">API</text><rect class="s1" x="494" y="188" width="126.31578947368416" height="18" rx="4"><title>API, before fix: 15.8 ms CPU per checkout, throttled in 7% of periods</title></rect><text class="value" x="626.3157894736842" y="201">16 ms before</text><rect class="s3" x="494" y="212" width="82.80442804428048" height="18" rx="4"><title>API, after fix: 10.4 ms CPU per checkout, throttled in 6% of periods</title></rect><text class="lab" x="582.8044280442805" y="225">10 ms after</text><text class="note" x="494" y="314">Before: ledger_entries (23k rows) had 29,632 full scans and</text><text class="note" x="494" y="330">0 index scans. After bug 75's indexes: 0 full scans.</text>
</g>
</svg>
