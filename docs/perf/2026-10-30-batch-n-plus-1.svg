1036 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-182.4213150241036 z"><title>Nightly settlement run, after: 2,833 statements</title></path><text class="value strong" x="402.4213150241036" y="116">2,833  (17× fewer)</text><path class="before" d="M520,92 h223.50199999999995 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-223.50199999999995 z"><title>Nightly settlement run, before: 21.1 s</title></path><text class="value" x="753.502" y="102">21.1 s</text><path class="after" d="M520,106 h39.361999999999966 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-39.361999999999966 z"><title>Nightly settlement run, after: 4.0 s</title></path><text class="value strong" x="569.362" y="116">4.0 s  (5.2× faster)</text><text class="label" x="0" y="155">One large batch</text><text class="sub" x="0" y="171">2,000 captures</text><path class="before" d="M210,144 h189.4866097827752 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-189.4866097827752 z"><title>One large batch, before: 3,829 statements</title></path><text class="value" x="409.4866097827752" y="154">3,829</text><path class="after" d="M210,158 h76.5335314670507 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-76.5335314670507 z"><title>One large batch, after: 31 statements</title></path><text class="value strong" x="296.5335314670507" y="168">31  (124× fewer)</text><path class="before" d="M520,144 h19.932800000000043 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-19.932800000000043 z"><title>One large batch, before: 2.2 s</title></path><text class="value" x="549.9328" y="154">2.2 s</text><path class="after" d="M520,158 h5.70920000000001 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-5.70920000000001 z"><title>One large batch, after: 899 ms</title></path><text class="value strong" x="535.7092" y="168">899 ms  (2.5× faster)</text><text class="label" x="0" y="207">Admin replay batch</text><text class="sub" x="0" y="223">500 deliveries</text><path class="before" d="M210,196 h141.97773441840775 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-141.97773441840775 z"><title>Admin replay batch, before: 505 statements</title></path><text class="value" x="361.97773441840775" y="206">505</text><path class="after" d="M210,210 h38.02016752071677 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-38.02016752071677 z"><title>Admin replay batch, after: 6 statements</title></path><text class="value strong" x="258.02016752071677" y="220">6  (84× fewer)</text><path class="before" d="M520,196 h1.409400000000005 a1.409400000000005,1.409400000000005 0 0 1 1.409400000000005,1.409400000000005 v9.18119999999999 a1.409400000000005,1.409400000000005 0 0 1 -1.409400000000005,1.409400000000005 h-1.409400000000005 z"><title>Admin replay batch, before: 261 ms</title></path><text class="value" x="528.8188" y="206">261 ms</text><path class="after" d="M520,210 h1 a1,1 0 0 1 1,1 v10 a1,1 0 0 1 -1,1 h-1 z"><title>Admin replay batch, after: 94 ms</title></path><text class="value strong" x="527.0152" y="220">94 ms  (2.8× faster)</text><text class="label" x="0" y="259">Recompute statuses</text><text class="sub" x="0" y="275">2,000 transactions</text><path class="before" d="M210,248 h174.29077126185314 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-174.29077126185314 z"><title>Recompute statuses, before: 2,003 statements</title></path><text class="value" x="394.29077126185314" y="258">2,003</text><path class="after" d="M210,262 h28.511239531709975 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-28.511239531709975 z"><title>Recompute statuses, after: 4 statements</title></path><text class="value strong" x="248.51123953170998" y="272">4  (501× fewer)</text><path class="before" d="M520,248 h3.925799999999981 a3.925799999999981,3.925799999999981 0 0 1 3.925799999999981,3.925799999999981 v4.148400000000038 a3.925799999999981,3.925799999999981 0 0 1 -3.925799999999981,3.925799999999981 h-3.925799999999981 z"><title>Recompute statuses, before: 727 ms</title></path><text class="value" x="533.8516" y="258">727 ms</text><path class="after" d="M520,262 h1 a1,1 0 0 1 1,1 v10 a1,1 0 0 1 -1,1 h-1 z"><title>Recompute statuses, after: 81 ms</title></path><text class="value strong" x="526.8748" y="272">81 ms  (9.0× faster)</text>
</g>
