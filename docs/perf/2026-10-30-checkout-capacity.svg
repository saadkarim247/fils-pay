<title id="t">Checkout capacity: before vs after load shedding and pool sizing</title>
<desc id="d">Before (no shedding, pool 5): 5/s offered gives 5.0/s served, p95 690 ms, 0 errors; 10/s offered gives 10.0/s served, p95 2360 ms, 0 errors; 15/s offered gives 12.7/s served, p95 12821 ms, 0 errors; 20/s offered gives 15.2/s served, p95 20688 ms, 0 errors; 30/s offered gives 15.2/s served, p95 27515 ms, 161 errors; 40/s offered gives 14.4/s served, p95 28820 ms, 410 errors. Shedding, pool 5: 5/s offered gives 5.0/s served, p95 709 ms, 0 errors; 10/s offered gives 9.5/s served, p95 1031 ms, 0 errors; 15/s offered gives 9.8/s served, p95 1111 ms, 0 errors; 20/s offered gives 10.2/s served, p95 1145 ms, 0 errors; 30/s offered gives 9.6/s served, p95 1184 ms, 0 errors; 40/s offered gives 9.9/s served, p95 1174 ms, 0 errors. Shedding, pool 20: 10/s offered gives 10.0/s served, p95 734 ms, 0 errors; 20/s offered gives 20.0/s served, p95 1320 ms, 0 errors; 30/s offered gives 23.7/s served, p95 2011 ms, 0 errors; 40/s offered gives 21.6/s served, p95 2538 ms, 0 errors; 50/s offered gives 22.5/s served, p95 2190 ms, 0 errors; 60/s offered gives 21.5/s served, p95 2299 ms, 0 errors.</desc>
