# FilsPay stack, production-shaped. This file alone is what the server runs:
#
#   ops/init-env.sh                                   # once: writes ops/.env (secrets, not in git)
#   docker compose -f ops/docker-compose.yml up -d --build
#
# On a laptop, `docker compose up` inside ops/ also loads
# docker-compose.override.yml (dev mode, local ports). See ops/README.md.
#
# Sized for the target box: the whole stack on 1 vCPU / 2 GB RAM, with the
# API limited to 0.5 vCPU / 512 MB. CPU limits below sum to 1.0.
#
# Secrets come only from ops/.env (compose reads it automatically because
# it sits next to this file); a missing one stops `up` with a message.

x-database-url: &database-url "postgres://filspay:${POSTGRES_PASSWORD:?run ops/init-env.sh to create ops/.env}@postgres:5432/filspay?sslmode=disable"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ops/init-env.sh to create ops/.env}
      POSTGRES_DB: filspay
    # Not published: only the services on this network reach it.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 640M }
    logging: *logging

  # One-off: applies db/migrations/*.sql (tracked by filename), then exits.
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
    logging: *logging

  # One-off, opt-in (it truncates its fixture tables):
  #   docker compose -f ops/docker-compose.yml --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: *database-url
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?run ops/init-env.sh}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    restart: unless-stopped
    # Loopback only until the TLS reverse proxy fronts it.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Required: the API refuses to start without an explicit NODE_ENV (bug 68).
      NODE_ENV: production
      # Keep the V8 heap well inside the 512 MB container limit.
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: *database-url
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?run ops/init-env.sh}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?run ops/init-env.sh}
      ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET:?run ops/init-env.sh}
      # KYC documents live on a volume, not in the container (a rebuild
      # used to delete every merchant's uploaded documents).
      KYC_UPLOAD_DIR: /data/kyc
    volumes:
      - filspay_kyc:/data/kyc
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    logging: *logging

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["./settlement", "daemon"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      # Required at boot. Its internal API (:8091) is reachable only on this network.
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?run ops/init-env.sh}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 128M }
    logging: *logging

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # No subcommand = the long-running worker.
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 256M }
    logging: *logging

volumes:
  filspay_pgdata:
  filspay_kyc:
